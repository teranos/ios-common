# A host for the island in the iPhone Simulator: an app that says it has Live
# Activities, the island's own widget embedded in it, and the island's own
# Swift compiled into both, with the Sentry and SacredError the build pins
# (apple/ios-project.py). Generated with xcodegen by run.sh. Whose island it
# is, an app's apple.json says; here it is drawn as nobody's in particular.
name: IslandDraw
options:
  bundleIdPrefix: nl.sbvh.islanddraw
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.32.0
  SacredError:
    url: https://github.com/teranos/sacred-error
    revision: d8834c0089eb56c6ad0aae78b1d0406a2ca7011a
targets:
  IslandDraw:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: App
      - path: ../../island/shared
      - path: ../../island/app
    info:
      path: App/Info.plist
      properties:
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.sbvh.islanddraw.app
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    dependencies:
      - target: IslandWidget
        embed: true
      - package: Sentry
      - package: SacredError
  IslandWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: ../../island/widget
      - path: ../../island/shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Island
        IslandMark: "•"
        IslandName: draw
        IslandAccent: 7dba8a
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.sbvh.islanddraw.app.island
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    dependencies:
      - package: Sentry
      - package: SacredError
