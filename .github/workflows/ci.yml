{
  "jobs": {
    "sheet": {
      "runs-on": "macos-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "components": "clippy,llvm-tools",
            "targets": "aarch64-apple-ios"
          }
        },
        {
          "uses": "cachix/install-nix-action@v31"
        },
        {
          "name": "The sheet answers for every warning",
          "run": "cargo clippy --target aarch64-apple-ios -- -D warnings",
          "working-directory": "sheet"
        },
        {
          "name": "The scripts parse",
          "run": "python3 -m py_compile apple/*.py\nsh -n apple/upload.sh\n"
        },
        {
          "name": "The template evaluates, with an island and without",
          "run": "nix eval --impure --json --expr 'import ./ci/ios.nix { tag = \"v0\"; profile = \"p\"; }' > /dev/null\nnix eval --impure --json --expr 'import ./ci/ios.nix { tag = \"v0\"; profile = \"p\"; island = { node = \"https://n\"; sentry = \"https://s\"; }; }' > /dev/null\n"
        },
        {
          "name": "Every workflow is what its nix says",
          "run": "for f in ci/*.nix; do\n  [ \"$f\" = ci/ios.nix ] && continue\n  nix eval --json --file \"$f\" | jq . | diff - \".github/workflows/$(basename \"$f\" .nix).yml\"\ndone\n"
        }
      ]
    }
  },
  "name": "ci",
  "on": {
    "pull_request": {},
    "push": {}
  }
}
